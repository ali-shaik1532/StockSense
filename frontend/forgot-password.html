<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSense — Reset Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand-panel">
      <div class="mark" id="brandMark"></div>
      <h2>Resetting access takes two minutes.</h2>
      <p>We'll send a one-time code to verify it's really you before letting you set a new password.</p>
    </div>
    <div class="auth-form-panel">
      <div class="auth-card">
        <h1>Reset your password</h1>
        <div class="sub" id="stepSub">Enter your email and we'll send a one-time code.</div>
        <div id="errors"></div>
        <div id="success"></div>

        <!-- STEP 1: request OTP -->
        <form id="requestForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
          </div>
          <button class="btn" type="submit">Send Code</button>
        </form>

        <!-- STEP 2: verify OTP + set new password -->
        <form id="resetForm" class="hidden">
          <div class="form-group">
            <label>6-Digit Code</label>
            <input type="text" id="otp" maxlength="6" placeholder="123456" required>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" minlength="8" required>
          </div>
          <button class="btn" type="submit">Reset Password</button>
        </form>

        <div class="switch"><a href="index.html">Back to login</a></div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('brandMark').innerHTML = Icon.crate(22) + ' StockSense';
    let submittedEmail = '';

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorsEl = document.getElementById('errors');
      showFormErrors(errorsEl, []);
      submittedEmail = document.getElementById('email').value.trim();

      try {
        await apiRequest('/auth/forgot-password', { method: 'POST', body: { email: submittedEmail } });
        document.getElementById('success').innerHTML =
          `<div class="success-box">If that account exists, a code was sent. (Local dev: check the backend server console for the code.)</div>`;
        document.getElementById('requestForm').classList.add('hidden');
        document.getElementById('resetForm').classList.remove('hidden');
        document.getElementById('stepSub').textContent = `Enter the code sent for ${submittedEmail}`;
      } catch (err) {
        showFormErrors(errorsEl, err.errors || [err.message]);
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorsEl = document.getElementById('errors');
      showFormErrors(errorsEl, []);

      const otp = document.getElementById('otp').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      try {
        await apiRequest('/auth/reset-password', { method: 'POST', body: { email: submittedEmail, otp, newPassword } });
        document.getElementById('success').innerHTML = `<div class="success-box">Password reset. Redirecting to login…</div>`;
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        showFormErrors(errorsEl, err.errors || [err.message]);
      }
    });
  </script>
</body>
</html>
