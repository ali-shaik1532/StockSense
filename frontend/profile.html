<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSense — My Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (function () {
      const main = renderLayout('profile');
      const user = getUser();
      main.innerHTML = `
        <div class="topbar"><div><h1>My Profile</h1><div class="subtitle">Your account details</div></div></div>
        <div class="card" style="max-width:480px;">
          <div class="form-group"><label>Name</label><div>${user.name}</div></div>
          <div class="form-group"><label>Email</label><div>${user.email}</div></div>
          <div class="form-group"><label>Role</label><div><span class="badge done">${user.role.replace('_', ' ')}</span></div></div>
          <button class="btn danger" onclick="doLogout()">Logout</button>
        </div>
      `;
    })();
  </script>
</body>
</html>
